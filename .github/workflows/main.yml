name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Archive
        run: |
          # Limpa o projeto para evitar lixo de builds anteriores
          xcodebuild clean -project ThreeOneOSFive.xcodeproj -scheme "3105"
          
          # Tenta buildar e salva o erro em um arquivo de texto para a gente ler
          xcodebuild archive \
            -project ThreeOneOSFive.xcodeproj \
            -scheme "3105" \
            -archivePath ThreeOneOSFive.xcarchive \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_IDENTITY="" 2> build_error.txt || (cat build_error.txt && exit 1)

      - name: Manual IPA Packaging
        run: |
          APP_PATH=$(find ThreeOneOSFive.xcarchive -name "*.app" | head -n 1)
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r GH777.ipa Payload
          rm -rf Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GH777-App
          path: GH777.ipa
