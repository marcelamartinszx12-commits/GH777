name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Archive
        run: |
          SCHEME=$(xcodebuild -list -project ThreeOneOSFive.xcodeproj | grep -A 1 "Schemes" | grep -v "Schemes" | tr -d ' ')
          echo "O Scheme detectado foi: $SCHEME"
          
          xcodebuild archive \
            -project ThreeOneOSFive.xcodeproj \
            -scheme "$SCHEME" \
            -archivePath ThreeOneOSFive.xcarchive \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_IDENTITY=""

      - name: Export IPA
        run: |
          # Criando um arquivo de opções simplificado na hora para evitar conflitos de Team
          echo '<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>ad-hoc</string>
              <key>signingStyle</key>
              <string>manual</string>
          </dict>
          </plist>' > exportOptions.plist

          xcodebuild -exportArchive \
            -archivePath ThreeOneOSFive.xcarchive \
            -exportPath ThreeOneOSFive_IPA \
            -exportOptionsPlist exportOptions.plist \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_IDENTITY=""

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GH777-App
          path: ThreeOneOSFive_IPA/*.ipa
