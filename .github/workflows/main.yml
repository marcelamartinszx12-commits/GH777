name: Build IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build and Archive
        run: |
          # Comando para encontrar o nome correto do scheme disponível no projeto
          SCHEME=$(xcodebuild -list -project ThreeOneOSFive.xcodeproj | grep -A 1 "Schemes" | grep -v "Schemes" | tr -d ' ')
          echo "O Scheme detectado foi: $SCHEME"
          
          xcodebuild archive \
            -project ThreeOneOSFive.xcodeproj \
            -scheme "$SCHEME" \
            -archivePath ThreeOneOSFive.xcarchive \
            -sdk iphoneos

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath ThreeOneOSFive.xcarchive \
            -exportPath ThreeOneOSFive_IPA \
            -exportOptionsPlist exportOptions.plist

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GH777-App
          path: ThreeOneOSFive_IPA/*.ipa
