name: build ipa

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v4

      - name: build and archive
        run: |
          scheme=$(xcodebuild -list -project threeoneosfive.xcodeproj | grep -a 1 "schemes" | grep -v "schemes" | tr -d ' ')
          echo "o scheme detectado foi: $scheme"
          
          xcodebuild archive \
            -project threeoneosfive.xcodeproj \
            -scheme "$scheme" \
            -archivepath threeoneosfive.xcarchive \
            -sdk iphoneos \
            code_signing_allowed=no \
            code_signing_identity=""

      - name: manual ipa packaging
        run: |
          # 1. localiza o arquivo .app dentro do archive
          app_path=$(find threeoneosfive.xcarchive -name "*.app" | head -n 1)
          echo "app localizado em: $app_path"
          
          # 2. cria a estrutura de pastas necessária para um ipa
          mkdir -p payload
          cp -r "$app_path" payload/
          
          # 3. compacta a pasta payload em um arquivo .zip e renomeia para .ipa
          zip -r gh777.ipa payload
          
          # 4. move o arquivo para a pasta de artefatos
          mkdir -p threeoneosfive_ipa
          mv gh777.ipa threeoneosfive_ipa/

      - name: upload ipa
        uses: actions/upload-artifact@v4
        with:
          name: gh777-app
          path: threeoneosfive_ipa/*.ipa
