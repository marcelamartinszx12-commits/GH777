name: Build IPA

on:
  workflow_dispatch: # Permite que você inicie o build manualmente

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.0' # Versão compatível com o projeto 3105

      - name: Build and Archive
        run: |
          xcodebuild archive \
            -project ThreeOneOSFive.xcodeproj \
            -scheme ThreeOneOSFive \
            -archivePath ThreeOneOSFive.xcarchive \
            -sdk iphoneos \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath ThreeOneOSFive.xcarchive \
            -exportPath ./build \
            -exportOptionsPlist exportOptions.plist # Nota: Se der erro aqui, precisaremos criar este arquivo

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GH777-App
          path: build/*.ipa
